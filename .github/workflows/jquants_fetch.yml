name: Fetch J-Quants Data

on:
  workflow_dispatch:
  schedule:
    # 毎週月〜金 07:30 JST に実行(cronはUTC基準。22:30 UTC(日〜木)= 翌07:30 JST)
    # ※GitHub Actionsのscheduleは実行環境の混雑状況で数分〜数十分遅れることがある
    - cron: '30 22 * * 0-4'

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    # Freeプランは1分5回の制限なので、監視10銘柄+市場スキャンで約36リクエスト≒8分かかる。
    # 429(制限超過)で待つ分の余裕も見て25分。万一の暴走防止も兼ねる。
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run analysis script
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

          # ── 株専用のLINE(推奨) ──
          # 設定すると株の通知はこちらのチャネルに届く(BTC用とは別のトーク)。
          # トークンは、Secretsの LINE_STOCK_CHANNEL_ACCESS_TOKEN でも、登録済みの LINE_STOCK_TOKEN でもOK。
          # 宛先ユーザーID(LINE_STOCK_USER_ID)は、株専用チャネルがBTCと別のLINEプロバイダにある場合だけ登録が必要。
          # 同じプロバイダなら、下の LINE_USER_ID(BTCと共通)がそのまま使われる。
          # 未設定ならBTCと共用の下2つにフォールバックする。株専用チャネルに送れなかった時も、BTC共用に切り替えて再送する。
          LINE_STOCK_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_STOCK_CHANNEL_ACCESS_TOKEN || secrets.LINE_STOCK_TOKEN }}
          LINE_STOCK_USER_ID: ${{ secrets.LINE_STOCK_USER_ID }}

          # ── BTCと共用(フォールバック) ──
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

          # ── 授業料予算(Settings > Secrets and variables > Actions > Variables で変更可。コード修正不要) ──
          # TUITION_BUDGET_YEN    : 全部失ってもいいと思える額。「もし買うなら」の株数計算の元になる(既定10万円)
          # MAX_LOSS_PCT_PER_TRADE: 1回の取引で失ってよい割合(予算に対する%。既定5%)
          TUITION_BUDGET_YEN: ${{ vars.TUITION_BUDGET_YEN || '100000' }}
          MAX_LOSS_PCT_PER_TRADE: ${{ vars.MAX_LOSS_PCT_PER_TRADE || '5' }}

          # ── 有料プランに切り替えたら、Variablesに下の2つを登録するだけでよい(コード変更不要) ──
          # JQUANTS_DELAY_WEEKS=0 / JQUANTS_MIN_INTERVAL_SEC=1.1
          JQUANTS_DELAY_WEEKS: ${{ vars.JQUANTS_DELAY_WEEKS || '12' }}
          JQUANTS_MIN_INTERVAL_SEC: ${{ vars.JQUANTS_MIN_INTERVAL_SEC || '13' }}
        run: python analyze_jquants.py
