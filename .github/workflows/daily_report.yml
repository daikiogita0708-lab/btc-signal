name: bitcoin-daily-report

on:
  schedule:
    # 毎日 08:00 JST に実行(cronはUTC基準。23:00 UTC(前日)= 08:00 JST)
    # ※GitHub Actionsのscheduleは混雑状況で数分〜数十分遅れることがある
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Send daily report
        env:
          BITFLYER_API_KEY: ${{ secrets.BITFLYER_API_KEY }}
          BITFLYER_API_SECRET: ${{ secrets.BITFLYER_API_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python daily_report.py
